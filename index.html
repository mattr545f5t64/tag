<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

body {
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  position: relative;
}

.bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url("bg.jpg");
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  z-index: 1;
}

.card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 360px;
  background: #ffffff;
  border-radius: 24px;
  padding: 28px 24px 24px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}

/* ===== AVATAR ===== */
.avatar-wrap {
  margin-bottom: 18px;
}

.avatar-ring {
  width: 110px;
  height: 110px;
  margin: 0 auto;
  border-radius: 50%;
  padding: 4px;
  background: linear-gradient(135deg, #2a5298, #6ea8ff 45%, #25d366);
  box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3);
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 20%;
  border: 3px solid #fff;
  display: block;
}

/* ===== PHONE BOX ===== */
.phone-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(180deg, #f4f8ff, #eaf1fb);
  border: 1px solid #d7e4f5;
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 16px;
}

.phone-icon {
  font-size: 1.3rem;
  color: #2a5298;
}

.phone-number {
  font-size: 1.25rem;
  font-weight: 800;
  color: #1a2f4f;
  letter-spacing: 1.2px;
  direction: ltr;
}

/* ===== BUTTONS ===== */
.buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 18px;
  border-radius: 14px;
  text-decoration: none;
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-icon {
  font-size: 1.2rem;
}

.call {
  background: linear-gradient(135deg, #1e3c72, #2a5298 55%, #3d73c8);
  box-shadow: 0 8px 20px rgba(30, 60, 114, 0.35);
}

.whatsapp {
  background: linear-gradient(135deg, #128c3c, #25d366 60%, #4ae07c);
  box-shadow: 0 8px 20px rgba(18, 140, 60, 0.3);
}

/* ===== MOBILE ===== */
@media (max-width: 400px) {
  .card { padding: 22px 18px 20px; border-radius: 20px; }
  .avatar-ring { width: 95px; height: 95px; }
  .phone-number { font-size: 1.1rem; }
  .btn { font-size: 0.95rem; padding: 12px 16px; }
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="card">

  <!-- الصورة الشخصية -->
  <div class="avatar-wrap">
    <div class="avatar-ring">
      <img class="avatar" src="avatar.jpg" alt="الصورة الشخصية" width="110" height="110">
    </div>
  </div>

  <!-- رقم الهاتف -->
  <div class="phone-box">
    <span class="phone-icon">&#9742;</span>
    <span class="phone-number">01551570849</span>
  </div>

  <!-- الأزرار -->
  <div class="buttons">
    <a class="btn call" href="tel:01551570849">
      <span class="btn-icon">&#128222;</span>
      <span>اتصال مباشر</span>
    </a>
    <a class="btn whatsapp" href="https://wa.me/201551570849" target="_blank" rel="noopener noreferrer">
      <span class="btn-icon">&#128172;</span>
      <span>مراسلة واتساب</span>
    </a>
  </div>

</div>

</body>
</html>
